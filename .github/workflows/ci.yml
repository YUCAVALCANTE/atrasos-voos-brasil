name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Testes
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t atrasos-api .
      - name: Smoke test da API
        run: |
          docker run -d -p 8000:8000 --name api atrasos-api
          for i in $(seq 1 30); do curl -sf localhost:8000/saude && break; sleep 1; done
          curl -sf -X POST localhost:8000/prever -H "Content-Type: application/json" \
            -d '[{"empresa":"GLO","numero_voo":"1234","origem":"SBGR","destino":"SBRJ","partida_prevista":"2026-11-20T18:30:00","chegada_prevista":"2026-11-20T19:35:00"}]'
