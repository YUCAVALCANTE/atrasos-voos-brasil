[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atrasos"
version = "0.1.0"
description = "Previsão de atrasos de voos no Brasil com os microdados VRA da ANAC"
authors = [{ name = "Yury Cavalcante" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "requests>=2.31",
    "holidays>=0.50",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
treino = ["mlflow>=2.12", "shap>=0.45", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402", "B905"]
